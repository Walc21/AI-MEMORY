name: Regression tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate standard-library-only pipeline
        run: |
          python -S -m unittest discover -s tests -p 'test_structural_core.py' -v
          python -S -m unittest discover -s tests -p 'test_semantic_core.py' -v
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-demo.txt -r requirements-structural.txt '.[ocr,signing]'
      - name: Install OCR system dependency
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Check syntax
        run: python -m compileall -q mimir input BN1_1 BN1_2 Transformer_Core examples tests
      - name: Run regressions
        run: python -m unittest discover -s tests -v
      - name: Verify installed CLI outside repository
        run: |
          task_dir=$(mktemp -d)
          cd "$task_dir"
          mimir episode 'Alice works at Acme.'
          mimir query 'Where Alice works?' --text
          mimir verify
      - name: Run offline semantic evaluation
        run: mimir eval
