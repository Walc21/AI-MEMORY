[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir-ai-memory"
version = "0.4.1"
description = "Local, auditable semantic memory grounded in verified source bytes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
structural = ["pypdf>=6,<7", "Pillow>=12,<13", "av==16.1.0"]
ocr = ["Pillow>=12,<13", "PyMuPDF>=1.26,<2", "pypdf>=6,<7"]
asr = ["faster-whisper>=1.2,<2"]
vectors = ["sentence-transformers>=5,<6"]
signing = ["cryptography>=45,<47"]
demo = ["numpy>=1.26,<3", "av==16.1.0", "openpyxl>=3.1,<4", "reportlab>=4,<5"]
mcp = ["mcp>=1.29,<2"]
drive = ["google-auth>=2.40,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]

[project.scripts]
mimir = "mimir.__main__:main"

[tool.setuptools]
py-modules = ["mimir_version"]

[tool.setuptools.packages.find]
include = ["mimir*", "input*", "BN1_1*", "BN1_2*", "Transformer_Core*", "examples*"]
exclude = ["tests*"]
namespaces = true
